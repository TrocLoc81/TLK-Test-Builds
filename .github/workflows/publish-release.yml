name: Publish TLK test release

on:
  push:
    branches:
      - main
    paths:
      - "downloads/**"
      - "RELEASE_NOTES.md"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: tlk-test-latest
      U1_VERSIONED_APK: downloads/TLK-U1-PoC-004.apk
      U1_STABLE_APK: TLK-U1-latest-debug.apk
      U1_SHA256: 4b7c53ff3b6267afa3dde28e00543f1328eed416b972023f7a612675c7082677
      PHONE_VERSIONED_APK: downloads/TLK-Phone-PoC-004.apk
      PHONE_STABLE_APK: TLK-Phone-latest-debug.apk
      PHONE_SHA256: d4935bdb02c60d199968f8f9cee206e1eec7a1ce4ee4b3ef7886470d74e54767
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify APKs
        run: |
          echo "$U1_SHA256  $U1_VERSIONED_APK" | sha256sum --check -
          echo "$PHONE_SHA256  $PHONE_VERSIONED_APK" | sha256sum --check -

      - name: Prepare stable filenames
        run: |
          cp "$U1_VERSIONED_APK" "$U1_STABLE_APK"
          cp "$PHONE_VERSIONED_APK" "$PHONE_STABLE_APK"

      - name: Create or update rolling test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            "$U1_VERSIONED_APK"
            "$U1_STABLE_APK"
            "$PHONE_VERSIONED_APK"
            "$PHONE_STABLE_APK"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "TLK latest test builds" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "TLK latest test builds" \
              --notes-file RELEASE_NOTES.md \
              --prerelease
          fi
