name: Publish TLK test release

on:
  push:
    branches:
      - main
    paths:
      - "downloads/**"
      - "RELEASE_NOTES.md"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: tlk-test-latest
      VERSIONED_APK: downloads/TLK-U1-PoC-003.apk
      STABLE_APK: TLK-U1-latest-debug.apk
      EXPECTED_SHA256: dee3c32066e9ec4fa6282b5e6d7c978877f12aaa49485f4b81798cb109c0ebd5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify APK
        run: echo "$EXPECTED_SHA256  $VERSIONED_APK" | sha256sum --check -

      - name: Prepare stable filename
        run: cp "$VERSIONED_APK" "$STABLE_APK"

      - name: Create or update rolling test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED_APK" "$STABLE_APK" --clobber
            gh release edit "$TAG"               --title "TLK latest test build"               --notes-file RELEASE_NOTES.md               --prerelease
          else
            gh release create "$TAG" "$VERSIONED_APK" "$STABLE_APK"               --target "$GITHUB_SHA"               --title "TLK latest test build"               --notes-file RELEASE_NOTES.md               --prerelease
          fi
